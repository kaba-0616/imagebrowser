name: ImageBrowser
options:
  bundleIdPrefix: jp.kaba
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Universal (iPhone + iPad). See ImageSaver/project.yml for why: dropping
    # to iPhone-only still hit App Store Connect's iPad-multitasking
    # orientation requirement (error 90474) at upload time.
    TARGETED_DEVICE_FAMILY: "1,2"
    # Team ID and profile names aren't secrets -- only the certificate/profile
    # *files* themselves (installed at CI runtime from GitHub secrets) are.
    # The unsigned build (build.yml) overrides all of this at the xcodebuild
    # command line (CODE_SIGNING_ALLOWED=NO etc.), so these defaults only
    # take effect for the signed TestFlight workflow.
    DEVELOPMENT_TEAM: BY99ZS478M
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) IMAGEBROWSER_DEV_TOOLS

packages:
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    exactVersion: 0.18.3
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0

targets:
  ImageBrowserApp:
    type: application
    platform: iOS
    sources:
      - path: ImageBrowserApp
    info:
      path: ImageBrowserApp/Info.plist
      properties:
        CFBundleDisplayName: ImageBrowser
        # Must be declared explicitly: XcodeGen does not derive these from
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION, and they otherwise
        # default to 1.0/1 no matter what the build settings say.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "抽出した画像をカメラロールに保存するために使用します。"
        # imagebrowser用にAdMobコンソールで発行した実App ID。
        GADApplicationIdentifier: "ca-app-pub-1034383442757151~4077627135"
        NSUserTrackingUsageDescription: "広告の表示に使う情報の取得許可をお願いします。許可しなくても広告自体は表示されますが、内容の関連性が下がります。"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
